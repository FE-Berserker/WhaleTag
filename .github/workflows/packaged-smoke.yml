name: Packaged Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unpacked:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build an unpacked production package
        run: npm run package:win -- --dir
      - name: Smoke main process and fulltext utilityProcess
        run: node scripts/packaged-smoke.js
      - name: Smoke real renderer interactions
        run: node scripts/packaged-gui-smoke.js
      - name: Run repeatable GUI accessibility and layout regression
        run: npm run test:gui
      - name: Smoke read-only LAN desktop and mobile clients
        run: npm run test:lan
      - name: Smoke Draw.io render/edit and host Save readback
        run: node scripts/packaged-drawio-smoke.js
      - name: Smoke Excalidraw edit/save and Mermaid preview/insert
        run: node scripts/packaged-excalidraw-smoke.js
      - name: Upload packaged smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-diagnostics
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 7
