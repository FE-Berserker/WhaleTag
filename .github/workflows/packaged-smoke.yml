name: Packaged Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unpacked:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build an unpacked production package
        run: npm run package:win -- --dir
      - name: Smoke main process and fulltext utilityProcess
        run: node scripts/packaged-smoke.js
      - name: Smoke real renderer interactions
        run: node scripts/packaged-gui-smoke.js
      - name: Smoke Draw.io init/render/edit (disk save not covered)
        run: node scripts/packaged-drawio-smoke.js
